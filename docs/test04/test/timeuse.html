<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <title>生活時間調査</title>
    <script src="../../dist/jspsych.js"></script>
    <!-- survey plugins -->
    <script src="../../dist/plugin-survey-multi-choice.js"></script>
    <script src="../../dist/plugin-survey-likert.js"></script>
    <script src="../../dist/plugin-survey-html-form.js"></script>
    <script src="../../dist/plugin-survey-text.js"></script>

    <!-- misc plugins -->
    <script src="../../dist/plugin-html-keyboard-response.js"></script> 
    
    <link rel="stylesheet" href="../../dist/jspsych.css" />

    <style>
      /* カードコンテナのスタイル */
      body {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      }

      .jspsych-content-wrapper {
        background: transparent !important;
      }

      .jspsych-content {
        background: white;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 40px;
        max-width: 800px;
        margin: 20px auto;
      }

      /* カードスタイル */
      .instruction {
        background: #ffffff;
        border-radius: 15px;
        padding: 30px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: #667eea;
        font-size: 2em;
        margin-bottom: 20px;
        text-align: center;
        font-weight: 600;
      }

      h2 {
        color: #764ba2;
        font-size: 1.5em;
        margin-top: 25px;
        margin-bottom: 15px;
        font-weight: 500;
      }

      h3 {
        color: #555;
        font-size: 1.2em;
        margin-top: 20px;
        margin-bottom: 10px;
        padding-left: 10px;
        border-left: 4px solid #667eea;
      }

      /* セクションカード */
      .question-card {
        background: #f8f9fa;
        border-radius: 10px;
        padding: 20px;
        margin: 15px 0;
        border: 1px solid #e9ecef;
        transition: all 0.3s ease;
      }

      .question-card:hover {
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        transform: translateY(-2px);
      }

      /* フォーム要素のスタイル */
      input[type="text"],
      input[type="date"],
      select {
        width: 100%;
        padding: 12px 15px;
        border: 2px solid #e9ecef;
        border-radius: 8px;
        font-size: 1em;
        transition: all 0.3s ease;
        background: white;
        margin: 8px 0;
      }

      input[type="text"]:focus,
      input[type="date"]:focus,
      select:focus {
        outline: none;
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
      }

      input[type="text"][style*="border: 2px solid #ff6f33"],
      input[type="date"][style*="border: 2px solid #ff6f33"],
      select[style*="border: 2px solid #ff6f33"] {
        border-color: #667eea !important;
      }

      /* チェックボックスのスタイル */
      input[type="checkbox"] {
        margin-right: 10px;
        width: 18px;
        height: 18px;
        cursor: pointer;
      }

      label {
        font-size: 1em;
        color: #555;
        cursor: pointer;
        display: inline-block;
        margin: 5px 0;
      }

      /* ボタンのスタイル */
      .jspsych-btn {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 15px 40px;
        font-size: 1.1em;
        border-radius: 25px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        font-weight: 600;
      }

      .jspsych-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
      }

      /* 活動カテゴリーの背景色 */
      .option-primary {
        background-color: #EF9C66;  /* 1次活動の背景色 */
      }
      .option-secondary {
        background-color: #FCDC94;  /* 2次活動の背景色 */
      }

      .option-tertiary {
        background-color: #C8CFA0;  /* 3次活動の背景色 */
      }

      .option-even {
        background-color: #ffffff;  /* 偶数の背景色 */
      }
      .option-odd {
        background-color: #f8f9fa;  /* 奇数の背景色 */
      }

      /* 参考情報のスタイル */
      ul {
        background: #f8f9fa;
        padding: 20px 40px;
        border-radius: 10px;
        margin: 15px 0;
        list-style-type: none;
      }

      ul li {
        padding: 8px 0;
        font-size: 0.95em;
      }

      ul li span {
        padding: 4px 12px;
        border-radius: 5px;
        font-weight: 600;
        color: #333;
      }

      /* レスポンシブデザイン */
      @media (max-width: 768px) {
        .jspsych-content {
          padding: 20px;
        }

        .instruction {
          padding: 20px;
        }

        h1 {
          font-size: 1.5em;
        }

        h2 {
          font-size: 1.2em;
        }
      }

    </style>
  </head>
  <body></body>
  <script>

      // ファイル名取得
      const htmlFileName = window.location.pathname.split("/").pop().split(".")[0];  // 拡張子を除く

      // 参加者ID取得
      var participant_id = "";


      var jsPsych = initJsPsych({
        on_finish: function() {
          var data = jsPsych.data.get().csv();
          var encodedUri = encodeURI("data:text/csv;charset=utf-8," + data);
          var link = document.createElement("a");

          // ファイル名定義
          var fileName = htmlFileName + "_result_" + participant_id + ".csv";

          link.setAttribute("href", encodedUri);
          link.setAttribute("download", fileName);

          // ダウンロードボタンを作成
          var downloadButton = document.createElement("button");
          downloadButton.innerHTML = "回答ありがとうございました<br>このボタンを押した後<br>「ダウンロード」ボタンを押してください";

          // ボタンのスタイルを設定
          downloadButton.style.position = "absolute";
          downloadButton.style.top = "50%";
          downloadButton.style.left = "50%";
          downloadButton.style.transform = "translate(-50%, -50%)";
          downloadButton.style.padding = "20px 40px";
          downloadButton.style.fontSize = "24px";
          downloadButton.style.backgroundColor = "#4CAF50";
          downloadButton.style.color = "white";
          downloadButton.style.border = "none";
          downloadButton.style.borderRadius = "10px";
          downloadButton.style.cursor = "pointer";

          // ボタンがクリックされた時にダウンロードを実行
          downloadButton.onclick = function() {
            link.click();
          };

          // ボタンをドキュメントに追加
          document.body.appendChild(downloadButton);

        // 背景色を少し変えて目立たせる
        document.body.style.backgroundColor = "#f0f0f0";
      }
      });


      // Page 1:被験者IDの入力 
      var survey_id = {
        type: jsPsychSurveyHtmlForm,
        html: `
        <div class="instruction">
          <h1 style="margin-bottom: 30px;">識別用コードを入力してください。</h1>
          <div class="question-card">
            <label for="participant_id" style="font-size: 1.1em; display: block; margin-bottom: 10px;">
              あなたに割り当てられたID：
            </label>
            <input name="participant_id" type="text" inputmode="numeric" pattern="^[0-9]+$" required 
              placeholder="入力してください" style="border: 2px solid #ff6f33; font-size: 1.2em;">
            <p style="color: #666; margin-top: 10px; font-size: 0.9em;">※半角数字で入力してください。</p>
          </div>
        </div>
        `,
        required: true,
        button_label: '次へすすむ',
        on_finish: function(data) {
          // 参加者IDをjsPsychのデータストアに保存
          participant_id = data.response.participant_id;  // 参加者IDを保存
          jsPsych.data.addProperties({participant_id: data.response.participant_id});
        }
      };


    // 日にちの選択
    var survey_day = {
      type: jsPsychSurveyHtmlForm,
          html: `
          <div class="instruction">
          <h1>回答する日のことをお伺いします。</h1>
          
          <div class="question-card">
            <h3>日付を選択してください。</h3>
            <label for="survey_day">回答する日付：</label>
            <input type="date" id="survey_day" name="date" min="2024-09-01" required 
            value="${new Date().toISOString().split('T')[0]}" style="border: 2px solid #ff6f33; font-size: 1.2em;">
          </div>

          <div class="question-card">
            <h3>その日の天気について選択してください。</h3>
            <label for="weather">天気：</label>
            <select name="weather" id="weather" required style="border: 2px solid #ff6f33;">
              <option value="" disabled selected>選択してください</option>
              <option value="without_rain">降雨なし（晴れあるいはくもり）</option>
              <option value="sometime_rain">一時雨</option>
              <option value="allday_rain">一日中雨</option>
            </select>
          </div>

          <div class="question-card">
            <h3>その日の主要な予定や出来事について当てはまるものをすべて選択してください。</h3>
            <div style="display: grid; grid-template-columns: 1fr; gap: 10px; padding: 10px;">
              <label style="padding: 10px; background: white; border-radius: 8px; transition: all 0.2s;">
                <input type="checkbox" id="travel" name="events" />
                旅行・行楽
              </label>
              <label style="padding: 10px; background: white; border-radius: 8px; transition: all 0.2s;">
                <input type="checkbox" id="ceremony" name="events" />
                行事または冠婚葬祭（半日以上の参加）
              </label>
              <label style="padding: 10px; background: white; border-radius: 8px; transition: all 0.2s;">
                <input type="checkbox" id="business_trip" name="events" />
                出張・研修など
              </label>
              <label style="padding: 10px; background: white; border-radius: 8px; transition: all 0.2s;">
                <input type="checkbox" id="telework" name="events" />
                テレワーク
              </label>
              <label style="padding: 10px; background: white; border-radius: 8px; transition: all 0.2s;">
                <input type="checkbox" id="medical_leave" name="events" />
                療養
              </label>
              <label style="padding: 10px; background: white; border-radius: 8px; transition: all 0.2s;">
                <input type="checkbox" id="day_off" name="events" />
                休みの日（休暇・休日など）
              </label>
              <label style="padding: 10px; background: white; border-radius: 8px; transition: all 0.2s;">
                <input type="checkbox" id="childcare_leave" name="events" />
                育児休業・育児休暇
              </label>
              <label style="padding: 10px; background: white; border-radius: 8px; transition: all 0.2s;">
                <input type="checkbox" id="caregiver_leave" name="events" />
                介護休業・介護休暇
              </label>
            </div>
          </div>
          </div>
          `,
      required: true,
      button_label: '次へすすむ'
    };


    // 活動の選択肢リスト
    const behaviors = [
      { value: "01", text: "睡眠" },
      { value: "02", text: "身の回りの用事" },
      { value: "03", text: "食事" },
      { value: "04", text: "通勤・通学" },
      { value: "05", text: "仕事" },
      { value: "06", text: "学業" },
      { value: "07", text: "家事" },
      { value: "08", text: "介護・看護" },
      { value: "09", text: "育児" },
      { value: "10", text: "買い物" },
      { value: "11", text: "移動（通勤・通学を除く）" },
      { value: "12", text: "テレビ・ラジオ・新聞・雑誌" },
      { value: "13", text: "休養・くつろぎ" },
      { value: "14", text: "学習・自己啓発・訓練（学業以外）" },
      { value: "15", text: "趣味・娯楽" },
      { value: "16", text: "スポーツ" },
      { value: "17", text: "ボランティア活動・社会参加活動" },
      { value: "18", text: "交際・つきあい" },
      { value: "19", text: "受診・療養" },
      { value: "20", text: "その他" }
    ];

    // 動的に活動の選択肢を生成
    function option_behaviors() {
      let optionsHTML = `<option value="" disabled selected>選択してください</option>`;
      behaviors.forEach(function(activity) {
        let className = "";  // デフォルトで空のクラス名
        // クラスを条件に基づいて割り当てる
        if (activity.value === "01" || activity.value === "02" || activity.value === "03") {
          className = "option-primary";
        } else if (["04", "05", "06", "07", "08", "09", "10"].includes(activity.value)) {
          className = "option-secondary";
        } else {
          className = "option-tertiary";
        }
        // 条件に応じたクラスを含むオプションを1回だけ追加
        optionsHTML += `<option class="${className}" value="${activity.value}">${activity.text}</option>`;
      });
      return optionsHTML;
    }

    // 時間のリスト（15分間隔）
    const time_slots = Array.from({ length: 96 }, (_, i) => {
      const hours = Math.floor(i / 4);
      const minutes = (i % 4) * 15;
      return {
        value: i + 1,
        text: `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}`
      };
    }).concat({ value: 97, text: "24:00" });

    // 動的に終了時刻の選択肢を生成
    function option_time(from_index) {
      let optionsHTML = `<option value="" disabled selected>選択してください</option>`;
      time_slots.slice(from_index + 1).forEach(function(slot, index) {
        const className = index % 2 === 0 ? 'option-even' : 'option-odd';  // 偶数と奇数でクラスを分ける
        optionsHTML += `<option class="${className}" value="${slot.value}">${slot.text}</option>`;
      });
      return optionsHTML;
    }

    // 誰と一緒にいたかの選択肢リスト
    const people = [
      { value: "lonely", text: "1人で" },
      { value: "family", text: "家族" },
      { value: "colleague", text: "学校・職場の人" },
      { value: "other", text: "その他の人" }
    ];

    function option_people() {
      let optionsHTML = `<option value="" disabled selected>選択してください</option>`;
      people.forEach(function(activity) {
        optionsHTML += `<option value="${activity.value}">${activity.text}</option>`;
      });
      return optionsHTML;
    }

    
    var currentTrialIndex = 0;  // Track current trial index globally

    // 96個の質問を生成
    var survey_trial = {
      type: jsPsychSurveyHtmlForm,
      html: function() {
        return `
        <form>
          <div class="instruction">
            <h1>生活時間調査</h1>
            <h2 style="text-align: center; color: #667eea;"><u>${time_slots[currentTrialIndex].text}</u>の状況をお聞きします。</h2>
            
            <div class="question-card">
              <h3>1. 何をしていましたか？</h3>              
              <label for="bhvr">その時にしていた活動を選択してください:</label>
              <select name="bhvr" id="bhvr" required style="border: 2px solid #ff6f33;">
                ${option_behaviors()}
              </select>
              <div style="margin-top: 15px; padding: 15px; background: #f8f9fa; border-radius: 8px;">
                <strong>【参考】</strong>
                <ul style="margin-top: 10px; padding: 10px 20px; background: white;">
                  <li><span class="option-primary">1次活動</span>：生活になくてはならない活動（睡眠、身の回りの用事、食事）</li>
                  <li><span class="option-secondary">2次活動</span>：社会生活を営むうえで義務的な活動（仕事や学業など）</li>
                  <li><span class="option-tertiary">3次活動</span>：自由な活動（余暇や楽しみなど）</li>
                </ul>
              </div>
            </div>

            <div class="question-card">
              <h3>2. その活動や行動はいつまで続けましたか？</h3>
              <label for="time">終了時刻:</label>
              <select name="time" id="time" required style="border: 2px solid #ff6f33;">
                ${option_time(currentTrialIndex)}
              </select>
            </div>

            <div class="question-card">
              <h3>3. その時間帯に誰かと一緒にいましたか？</h3>
              <label for="people">誰と:</label>
              <select name="people" id="people" required style="border: 2px solid #ff6f33;">
                ${option_people()}
              </select>
            </div>
          </div>
        </form>
        `;
      },
      button_label: "次へすすむ",
      on_finish: function(data) {
        console.log(data.response);  // デバッグ用に追加
        // Get the selected end time
        var selectedTime = parseInt(data.response.time, 10);
        if (selectedTime < 97) {
          currentTrialIndex = selectedTime - 1;  // Update to the next trial index
        } else {
          currentTrialIndex = 97;  // 24:00が選ばれたらループを終了
          }
      }
    };

    

    // Loop the survey until 24:00 is selected
    var loop_node = {
      timeline: [survey_trial],
      loop_function: function() {
        return currentTrialIndex != 97;  // Continue looping until 24:00 is selected
      }
    };

    
    var timeline = [];
    // Add the survey to the timeline
    timeline.push(survey_id);
    timeline.push(survey_day);
    timeline.push(loop_node);

    // Run the experiment
    jsPsych.run(timeline);

  </script>
</html>
